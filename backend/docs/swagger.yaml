openapi: 3.0.3
info:
  title: IBU Chess API
  description: |
    A comprehensive chess management API for the IBU Chess platform.
    This API provides full CRUD operations for managing users, tournaments, games, moves, participants, and reviews.
    
    ## Features
    - User management with role-based access
    - Tournament organization and tracking
    - Game recording with move history
    - Review system for games
    - Tournament participant management
    
    ## Authentication
    Authentication will be implemented in Milestone 4 using JWT tokens.
    
  version: 3.0.0
  contact:
    name: IBU Chess Team
    email: support@ibuchess.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.ibuchess.com
    description: Production server (coming soon)

tags:
  - name: Users
    description: User management operations
  - name: Tournaments
    description: Tournament management operations
  - name: Games
    description: Chess game management operations
  - name: Moves
    description: Move tracking and management
  - name: Tournament Participants
    description: Tournament participant management
  - name: Reviews
    description: Game review and rating operations

paths:
  /:
    get:
      summary: API root endpoint
      description: Returns basic API information and available resources
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  version:
                    type: string
                  documentation:
                    type: string
                  resources:
                    type: array
                    items:
                      type: string

  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve a list of all users with optional filtering
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
        - name: order_by
          in: query
          description: Field to order by
          schema:
            type: string
        - name: order_dir
          in: query
          description: Order direction
          schema:
            type: string
            enum: [ASC, DESC]
        - name: role
          in: query
          description: Filter by user role
          schema:
            type: string
            enum: [player, coach, arbiter, admin]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Users
      summary: Create a new user
      description: Register a new user in the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

