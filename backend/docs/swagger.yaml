components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 120
        role:
          type: string
          enum: [player, coach, arbiter, admin]
          default: player
        rating:
          type: integer
          minimum: 0
          maximum: 3000
          default: 1200
        bio:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
