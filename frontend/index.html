<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IBU Chess — Milestone 1 Deluxe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">
</head>
<body class="bg-grid">
  <nav class="navbar navbar-expand-lg navbar-dark glass-nav border-bottom border-primary-subtle">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#/dashboard">
        <img src="./assets/logo.svg" width="30" height="30" alt="logo">
        <span class="fw-semibold">IBU Chess</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#/dashboard"><i class="bi bi-rocket-takeoff"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#/games"><i class="bi bi-controller"></i> Games</a></li>
          <li class="nav-item"><a class="nav-link" href="#/tournaments"><i class="bi bi-trophy"></i> Tournaments</a></li>
          <li class="nav-item"><a class="nav-link" href="#/profile"><i class="bi bi-person"></i> Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="#/admin"><i class="bi bi-sliders2"></i> Admin</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light btn-sm" href="#/auth/login"><i class="bi bi-box-arrow-in-right"></i> Login</a>
          <a class="btn btn-primary btn-sm glow" href="#/auth/register"><i class="bi bi-person-plus"></i> Register</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div id="app" class="fade"></div>
  </main>

  <footer class="container py-4 text-center text-secondary small">
    <div class="d-flex justify-content-center gap-3">
      <span><i class="bi bi-shield-lock"></i> JWT in M4</span>
      <span><i class="bi bi-upc-scan"></i> OpenAPI in M3</span>
      <span><i class="bi bi-cloud-upload"></i> Deploy in M5</span>
    </div>
  </footer>

  <div class="accent-blur"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/spa.js"></script>
  <script>window.addEventListener('DOMContentLoaded',()=>window.IBUChess.init());</script>
</body>
</html>
