<div class="row g-4">
  <div class="col-lg-4">
    <div class="card-soft p-4 text-center">
      <img src="./assets/avatar.png" width="96" height="96"
        class="rounded-circle mx-auto mb-3 border border-primary-subtle" alt="avatar">
      <h2 class="h5 mb-1" id="profile-username">Loading...</h2>
      <p class="text-secondary mb-1" id="profile-email">-</p>
      <p class="text-secondary small mb-3" id="profile-bio">No bio yet</p>
      <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
        <span class="badge-pill">Rating: <span id="profile-rating">-</span></span>
        <span class="badge-pill">Role: <span id="profile-role">-</span></span>
      </div>
      <button class="btn btn-primary btn-sm glow w-100" id="edit-profile-btn" data-bs-toggle="modal"
        data-bs-target="#editProfileModal">
        <i class="bi bi-pencil"></i> Edit Profile
      </button>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="card-soft p-4 mb-3">
      <h3 class="h6 mb-3"><i class="bi bi-info-circle"></i> Account Information</h3>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-2">
            <span class="text-secondary">Username:</span>
            <span class="fw-semibold" id="profile-username-detail">-</span>
          </div>
        </div>
        <div class="col-md-6">
          <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-2">
            <span class="text-secondary">Email:</span>
            <span class="fw-semibold" id="profile-email-detail">-</span>
          </div>
        </div>
        <div class="col-md-6">
          <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-2">
            <span class="text-secondary">Rating:</span>
            <span class="fw-semibold text-primary" id="profile-rating-detail">-</span>
          </div>
        </div>
        <div class="col-md-6">
          <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-2">
            <span class="text-secondary">Member since:</span>
            <span class="fw-semibold" id="profile-created">-</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card-soft p-4">
      <h3 class="h6 mb-3"><i class="bi bi-graph-up"></i> Statistics</h3>
      <div class="row g-2" id="profile-stats">
        <div class="col-md-4">
          <div class="stat">
            <div class="text-secondary small">Games Played</div>
            <div class="fs-4 fw-semibold">-</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat">
            <div class="text-secondary small">Tournaments</div>
            <div class="fs-4 fw-semibold">-</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat">
            <div class="text-secondary small">Win Rate</div>
            <div class="fs-4 fw-semibold">-</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark border border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title"><i class="bi bi-pencil"></i> Edit Profile</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="edit-error" class="alert alert-danger" style="display: none;"></div>
        <div id="edit-success" class="alert alert-success" style="display: none;"></div>

        <form id="edit-profile-form">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="edit-username" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="edit-email" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Bio</label>
            <textarea class="form-control" id="edit-bio" name="bio" rows="3"
              placeholder="Tell us about yourself..."></textarea>
          </div>
          <hr class="border-secondary">
          <h6 class="mb-3">Change Password (Optional)</h6>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="edit-password" name="password" minlength="6"
              placeholder="Leave blank to keep current">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" id="edit-password-confirm" name="password_confirm"
              minlength="6">
          </div>
        </form>
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary glow" id="save-profile-btn">
          <i class="bi bi-check-circle"></i> Save Changes
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentUser = null;

  async function loadProfileData() {
    try {
      currentUser = await API.auth.getCurrentUser();
      if (currentUser) {
        // Update profile card
        document.getElementById('profile-username').textContent = currentUser.username || 'Unknown';
        document.getElementById('profile-email').textContent = currentUser.email || 'No email';
        document.getElementById('profile-bio').textContent = currentUser.bio || 'No bio yet';
        document.getElementById('profile-rating').textContent = currentUser.rating || '1200';
        document.getElementById('profile-role').textContent = currentUser.role || 'player';

        // Update details
        document.getElementById('profile-username-detail').textContent = currentUser.username;
        document.getElementById('profile-email-detail').textContent = currentUser.email;
        document.getElementById('profile-rating-detail').textContent = currentUser.rating || '1200';

        // Format created date
        if (currentUser.created_at) {
          const date = new Date(currentUser.created_at);
          document.getElementById('profile-created').textContent = date.toLocaleDateString();
        }

        // Load stats (games, tournaments, etc.)
        await loadStats();
      } else {
        document.getElementById('profile-username').textContent = 'Not logged in';
      }
    } catch (error) {
      console.error('Error loading profile:', error);
      document.getElementById('profile-username').textContent = 'Error loading profile';
    }
  }

  async function loadStats() {
    // You can expand this to load real stats from the API
    const stats = document.getElementById('profile-stats');
    stats.innerHTML = `
    <div class="col-md-4">
      <div class="stat">
        <div class="text-secondary small">Games Played</div>
        <div class="fs-4 fw-semibold">0</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat">
        <div class="text-secondary small">Tournaments</div>
        <div class="fs-4 fw-semibold">0</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat">
        <div class="text-secondary small">Win Rate</div>
        <div class="fs-4 fw-semibold">N/A</div>
      </div>
    </div>
  `;
  }

  // Initialize edit form when modal opens
  document.getElementById('editProfileModal').addEventListener('show.bs.modal', function () {
    if (currentUser) {
      document.getElementById('edit-username').value = currentUser.username || '';
      document.getElementById('edit-email').value = currentUser.email || '';
      document.getElementById('edit-bio').value = currentUser.bio || '';
      document.getElementById('edit-password').value = '';
      document.getElementById('edit-password-confirm').value = '';

      // Hide messages
      document.getElementById('edit-error').style.display = 'none';
      document.getElementById('edit-success').style.display = 'none';
    }
  });

  // Save profile changes
  document.getElementById('save-profile-btn').addEventListener('click', async function () {
    const errorDiv = document.getElementById('edit-error');
    const successDiv = document.getElementById('edit-success');
    const saveBtn = this;

    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    const username = document.getElementById('edit-username').value;
    const email = document.getElementById('edit-email').value;
    const bio = document.getElementById('edit-bio').value;
    const password = document.getElementById('edit-password').value;
    const passwordConfirm = document.getElementById('edit-password-confirm').value;

    // Validate
    if (!username || !email) {
      errorDiv.textContent = 'Username and email are required';
      errorDiv.style.display = 'block';
      return;
    }

    if (password && password !== passwordConfirm) {
      errorDiv.textContent = 'Passwords do not match';
      errorDiv.style.display = 'block';
      return;
    }

    if (password && password.length < 6) {
      errorDiv.textContent = 'Password must be at least 6 characters';
      errorDiv.style.display = 'block';
      return;
    }

    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

    try {
      // Prepare update data
      const updateData = {
        username,
        email,
        bio
      };

      // Add password if changed
      if (password) {
        updateData.password = password;
      }

      // Call API to update user
      const response = await fetch(`${window.API_BASE_URL || 'http://localhost:8000'}/api/users/${currentUser.id}`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API.auth.getToken()}`
        },
        body: JSON.stringify(updateData)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Failed to update profile');
      }

      // Update local storage
      localStorage.setItem('user', JSON.stringify(data));

      successDiv.innerHTML = '<i class="bi bi-check-circle"></i> Profile updated successfully!';
      successDiv.style.display = 'block';

      // Reload profile data
      setTimeout(async () => {
        await loadProfileData();
        // Close modal
        const modal = bootstrap.Modal.getInstance(document.getElementById('editProfileModal'));
        modal.hide();

        // Update navigation
        if (window.App) {
          window.App.updateNavigation();
        }
      }, 1000);

    } catch (error) {
      console.error('Error updating profile:', error);
      errorDiv.innerHTML = `<i class="bi bi-exclamation-triangle"></i> ${error.message}`;
      errorDiv.style.display = 'block';
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="bi bi-check-circle"></i> Save Changes';
    }
  });

  // Load profile data on page load
  loadProfileData();
</script>
