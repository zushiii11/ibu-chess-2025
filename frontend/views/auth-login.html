<div class="row g-4 align-items-center">
  <div class="col-lg-6">
    <div class="p-3">
      <h1 class="h3 fw-semibold mb-2">Welcome back</h1>
      <p class="text-secondary">Sign in to continue to IBU Chess.</p>
      <img src="./assets/illus/login.png" class="img-fluid rounded-4 border border-secondary-subtle" alt="login illus">
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card-soft p-4">
      <h2 class="h5 mb-3"><i class="bi bi-box-arrow-in-right"></i> Login</h2>
      <div id="login-error" class="alert alert-danger" style="display: none;"></div>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" name="username" placeholder="your_username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary w-100 glow" type="submit">Login</button>
      </form>
      <div class="text-secondary small mt-3">
        Don't have an account? <a href="#/auth/register">Register here</a>
      </div>
    </div>
  </div>
</div>
<script>
  if (window.AuthHandler) {
    window.AuthHandler.initLogin();
  }
</script>
