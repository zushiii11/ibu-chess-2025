<div class="row g-4 align-items-center">
  <div class="col-lg-6 order-lg-2">
    <div class="p-3">
      <h1 class="h3 fw-semibold mb-2">Create your account</h1>
      <p class="text-secondary">Join tournaments, track ratings, and more.</p>
      <img src="./assets/illus/register.png" class="img-fluid rounded-4 border border-secondary-subtle" alt="register illus">
    </div>
  </div>
  <div class="col-lg-6 order-lg-1">
    <div class="card-soft p-4">
      <h2 class="h5 mb-3"><i class="bi bi-person-plus"></i> Register</h2>
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Username</label>
            <input class="form-control" type="text" placeholder="student123" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" placeholder="you@ibu.edu.ba" required>
          </div>
        </div>
        <div class="row g-3 mt-1">
          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirm Password</label>
            <input class="form-control" type="password" required>
          </div>
        </div>
        <button class="btn btn-success w-100 mt-3 glow" type="button" disabled>Create account (static)</button>
      </form>
      <div class="text-secondary small mt-3">Real registration will be enabled in Milestone 4.</div>
    </div>
  </div>
</div>
