<div class="row g-4">
    <div class="col-lg-8 mx-auto">
        <div class="card-soft p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="h4 mb-1"><i class="bi bi-cpu"></i> Play vs AI</h2>
                    <p class="text-secondary small mb-0">Challenge the computer</p>
                </div>
                <a href="#/play" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            </div>

            <!-- Difficulty Selection -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Select Difficulty:</label>
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="difficulty" id="easy" value="easy" checked>
                    <label class="btn btn-outline-success" for="easy"><i class="bi bi-emoji-smile"></i> Easy</label>

                    <input type="radio" class="btn-check" name="difficulty" id="medium" value="medium">
                    <label class="btn btn-outline-warning" for="medium"><i class="bi bi-emoji-neutral"></i>
                        Medium</label>

                    <input type="radio" class="btn-check" name="difficulty" id="hard" value="hard">
                    <label class="btn btn-outline-danger" for="hard"><i class="bi bi-emoji-frown"></i> Hard</label>
                </div>
            </div>

            <!-- Chess Board -->
            <div class="chess-board mb-4" id="chess-board">
                <!-- Board will be generated by JavaScript -->
            </div>

            <!-- Game Controls -->
            <div class="d-flex gap-2 justify-content-center mb-3">
                <button class="btn btn-primary glow" id="start-game"><i class="bi bi-play-fill"></i> Start Game</button>
                <button class="btn btn-outline-warning" id="reset-game"><i class="bi bi-arrow-clockwise"></i>
                    Reset</button>
                <button class="btn btn-outline-danger" id="resign-game"><i class="bi bi-flag"></i> Resign</button>
            </div>

            <!-- Game Status -->
            <div class="alert alert-info text-center" id="game-status">
                <i class="bi bi-info-circle"></i> Select difficulty and click "Start Game" to begin
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card-soft p-4 mb-3">
            <h4 class="h6 mb-3"><i class="bi bi-clock-history"></i> Move History</h4>
            <div id="move-history" class="small" style="max-height: 300px; overflow-y: auto;">
                <p class="text-secondary">No moves yet</p>
            </div>
        </div>

        <div class="card-soft p-4">
            <h4 class="h6 mb-3"><i class="bi bi-info-circle"></i> Game Info</h4>
            <div class="d-flex flex-column gap-2 small">
                <div class="d-flex justify-content-between">
                    <span class="text-secondary">Your Color:</span>
                    <span class="fw-semibold" id="player-color">White</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-secondary">AI Difficulty:</span>
                    <span class="fw-semibold" id="ai-difficulty">Easy</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-secondary">Moves:</span>
                    <span class="fw-semibold" id="move-count">0</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-secondary">Game ID:</span>
                    <span class="fw-semibold" id="game-id">-</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        const board = document.getElementById('chess-board');
        const startBtn = document.getElementById('start-game');
        const resetBtn = document.getElementById('reset-game');
        const resignBtn = document.getElementById('resign-game');
        const statusDiv = document.getElementById('game-status');
        const moveHistory = document.getElementById('move-history');
        const moveCount = document.getElementById('move-count');
        const aiDifficultyDisplay = document.getElementById('ai-difficulty');
        const gameIdDisplay = document.getElementById('game-id');
        const playerColorDisplay = document.getElementById('player-color');

        let gameStarted = false;
        let currentGameId = null;
        let moves = 0;
        let playerColor = 'white';

        // Initial chess piece positions (Unicode chess symbols)
        const initialPosition = [
            ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
            ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
            ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
        ];

        function createBoard() {
            board.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'chess-square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
                    square.textContent = initialPosition[row][col];
                    square.dataset.row = row;
                    square.dataset.col = col;
                    square.addEventListener('click', handleSquareClick);
                    board.appendChild(square);
                }
            }
        }

        async function handleSquareClick(e) {
            if (!gameStarted) {
                statusDiv.innerHTML = '<i class="bi bi-exclamation-triangle"></i> Please start the game first!';
                statusDiv.className = 'alert alert-warning text-center';
                return;
            }

            const square = e.target;
            const piece = square.textContent;

            if (piece) {
                // Simulate a move
                moves++;
                moveCount.textContent = moves;

                const notation = String.fromCharCode(97 + parseInt(square.dataset.col)) + (8 - parseInt(square.dataset.row));
                const moveDiv = document.createElement('div');
                moveDiv.className = 'mb-1 pb-1 border-bottom border-secondary';
                moveDiv.innerHTML = `<strong>${moves}.</strong> ${piece} to ${notation}`;

                if (moveHistory.querySelector('p')) {
                    moveHistory.innerHTML = '';
                }
                moveHistory.appendChild(moveDiv);

                statusDiv.innerHTML = '<i class="bi bi-check-circle"></i> Move made! AI is thinking...';
                statusDiv.className = 'alert alert-success text-center';

                // Get AI move from backend
                await getAiMove();
            }
        }

        async function getAiMove() {
            if (!currentGameId) return;

            try {
                const response = await fetch(`${window.API_BASE_URL || 'http://localhost:8000'}/api/ai-games/${currentGameId}/move`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API.auth.getToken()}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    moves++;
                    moveCount.textContent = moves;

                    const moveDiv = document.createElement('div');
                    moveDiv.className = 'mb-1 pb-1 border-bottom border-secondary';
                    moveDiv.innerHTML = `<strong>${data.move_number}.</strong> AI plays ${data.notation}`;
                    moveHistory.appendChild(moveDiv);

                    statusDiv.innerHTML = '<i class="bi bi-cpu"></i> AI made a move. Your turn!';
                    statusDiv.className = 'alert alert-info text-center';
                } else {
                    throw new Error(data.error || 'Failed to get AI move');
                }
            } catch (error) {
                console.error('AI move error:', error);
                statusDiv.innerHTML = `<i class="bi bi-exclamation-triangle"></i> ${error.message}`;
                statusDiv.className = 'alert alert-danger text-center';
            }
        }

        startBtn.addEventListener('click', async function () {
            const difficulty = document.querySelector('input[name="difficulty"]:checked').value;
            aiDifficultyDisplay.textContent = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);

            // Disable button while creating game
            startBtn.disabled = true;
            startBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating game...';

            try {
                // Create AI game via backend
                const response = await fetch(`${window.API_BASE_URL || 'http://localhost:8000'}/api/ai-games`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API.auth.getToken()}`
                    },
                    body: JSON.stringify({
                        difficulty: difficulty,
                        player_color: 'white'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    currentGameId = data.game_id;
                    gameIdDisplay.textContent = data.game_id;
                    playerColor = data.user_color;
                    playerColorDisplay.textContent = playerColor.charAt(0).toUpperCase() + playerColor.slice(1);

                    gameStarted = true;
                    createBoard();
                    statusDiv.innerHTML = `<i class="bi bi-play-circle"></i> Game #${data.game_id} started! Make your move (${playerColor})`;
                    statusDiv.className = 'alert alert-success text-center';
                    startBtn.innerHTML = '<i class="bi bi-play-fill"></i> New Game';
                } else {
                    throw new Error(data.error || 'Failed to create AI game');
                }
            } catch (error) {
                console.error('Game creation error:', error);
                statusDiv.innerHTML = `<i class="bi bi-exclamation-triangle"></i> ${error.message}`;
                statusDiv.className = 'alert alert-danger text-center';
            } finally {
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="bi bi-play-fill"></i> Start Game';
            }
        });

        resetBtn.addEventListener('click', function () {
            gameStarted = false;
            currentGameId = null;
            moves = 0;
            moveCount.textContent = '0';
            gameIdDisplay.textContent = '-';
            moveHistory.innerHTML = '<p class="text-secondary">No moves yet</p>';
            createBoard();
            statusDiv.innerHTML = '<i class="bi bi-info-circle"></i> Game reset. Click "Start Game" to begin';
            statusDiv.className = 'alert alert-info text-center';
            startBtn.innerHTML = '<i class="bi bi-play-fill"></i> Start Game';
        });

        resignBtn.addEventListener('click', function () {
            if (gameStarted) {
                gameStarted = false;
                statusDiv.innerHTML = '<i class="bi bi-x-circle"></i> You resigned. AI wins!';
                statusDiv.className = 'alert alert-danger text-center';
                startBtn.innerHTML = '<i class="bi bi-play-fill"></i> Start Game';
            }
        });

        // Update difficulty display when changed
        document.querySelectorAll('input[name="difficulty"]').forEach(radio => {
            radio.addEventListener('change', function () {
                const difficulty = this.value;
                aiDifficultyDisplay.textContent = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
            });
        });

        // Initialize board
        createBoard();
    })();
</script>
