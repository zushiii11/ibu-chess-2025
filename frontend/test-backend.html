<!DOCTYPE html>
<html>
<head>
  <title>Backend Connection Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .test { padding: 10px; margin: 10px 0; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Backend Connection Test</h1>
  <div id="results"></div>
  
  <button onclick="testBackend()">Test Backend Connection</button>
  <button onclick="testRegister()">Test Registration Endpoint</button>
  
  <script>
    const BASE_URL = 'http://localhost:8000';
    const API_URL = BASE_URL + '/api';
    
    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `test ${type}`;
      div.textContent = message;
      document.getElementById('results').appendChild(div);
      console.log(message);
    }
    
    async function testBackend() {
      document.getElementById('results').innerHTML = '';
      log('Testing backend connection...', 'info');
      
      try {
        const response = await fetch(BASE_URL + '/');
        if (response.ok) {
          const data = await response.json();
          log('✅ Backend is running!', 'success');
          log(`Message: ${data.message}`, 'success');
          log(`Version: ${data.version}`, 'success');
        } else {
          log(`❌ Backend responded with status: ${response.status}`, 'error');
        }
      } catch (error) {
        log(`❌ Cannot connect to backend: ${error.message}`, 'error');
        log('Make sure backend is running: php -S localhost:8000 -t backend/public', 'error');
      }
    }
    
    async function testRegister() {
      document.getElementById('results').innerHTML = '';
      log('Testing registration endpoint...', 'info');
      
      const testData = {
        username: 'testuser' + Date.now(),
        email: 'test' + Date.now() + '@example.com',
        password: 'password123',
        role: 'player'
      };
      
      try {
        const response = await fetch(API_URL + '/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(testData)
        });
        
        if (response.ok) {
          const data = await response.json();
          log('✅ Registration endpoint works!', 'success');
          log(`User created: ${data.user.username}`, 'success');
          log(`Token received: ${data.token ? 'Yes' : 'No'}`, 'success');
        } else {
          const error = await response.json();
          log(`❌ Registration failed: ${error.error || response.statusText}`, 'error');
          log(`Status: ${response.status}`, 'error');
        }
      } catch (error) {
        log(`❌ Network error: ${error.message}`, 'error');
        log('This usually means:', 'error');
        log('1. Backend server is not running', 'error');
        log('2. Backend is on a different port', 'error');
        log('3. CORS is blocking the request', 'error');
      }
    }
    
    // Auto-test on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(testBackend, 500);
    });
  </script>
</body>
</html>
